    <style>
      #loader {
        position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
        background: radial-gradient(ellipse at 50% 42%, #24357a 0%, #16226a 38%, #0b1233 100%);
        color: #fbf7ee; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden;
        transition: opacity 0.9s ease, transform 0.9s ease, filter 0.9s ease;
      }
      #loader.out { opacity: 0; transform: scale(1.06); filter: blur(6px); pointer-events: none; }
      #loader .stars, #loader .stars::after {
        position: absolute; inset: 0; content: '';
        background-image:
          radial-gradient(1.5px 1.5px at 12% 18%, #fff8, transparent), radial-gradient(1px 1px at 28% 72%, #fff7, transparent),
          radial-gradient(1.5px 1.5px at 44% 12%, #fff9, transparent), radial-gradient(1px 1px at 63% 84%, #fff6, transparent),
          radial-gradient(1.5px 1.5px at 78% 26%, #fff8, transparent), radial-gradient(1px 1px at 88% 62%, #fff7, transparent),
          radial-gradient(1px 1px at 6% 52%, #fff6, transparent), radial-gradient(1.5px 1.5px at 54% 44%, #fff5, transparent),
          radial-gradient(1px 1px at 35% 38%, #fff6, transparent), radial-gradient(1.5px 1.5px at 70% 8%, #fff7, transparent),
          radial-gradient(1px 1px at 18% 90%, #fff5, transparent), radial-gradient(1px 1px at 94% 90%, #fff6, transparent);
        animation: ld-twinkle 4s ease-in-out infinite alternate;
      }
      #loader .stars::after { transform: translate(3%, 5%) scale(1.1); animation-delay: -2s; }
      #loader .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 16px; text-align: center; }
      #loader svg.emblem { width: min(64vw, 300px); height: auto; overflow: visible; filter: drop-shadow(0 10px 40px rgba(242, 198, 107, 0.18)); }
      #loader .ring-fill { transition: stroke-dashoffset 0.35s ease-out; }
      #loader .stem { transition: stroke-dashoffset 0.35s ease-out; }
      #loader .pop { transform: scale(0); transform-box: fill-box; transition: transform 0.55s cubic-bezier(0.34, 1.7, 0.6, 1); }
      #loader .leaf .pop { transform-origin: left center; }
      #loader .bloom .pop { transform-origin: center; }
      #loader .pop.on { transform: scale(1); }
      #loader .sway { transform-box: fill-box; transform-origin: bottom center; animation: ld-sway 2.6s ease-in-out infinite alternate; }
      #loader .sapling { transform-box: fill-box; transform-origin: bottom center; animation: ld-sway 4.2s ease-in-out infinite alternate; }
      #loader .orbit { transform-origin: 100px 100px; animation: ld-orbit 14s linear infinite; }
      #loader .orbit.b { animation-duration: 19s; animation-direction: reverse; }
      #loader .wing { transform-box: fill-box; animation: ld-flap 0.22s ease-in-out infinite alternate; }
      #loader .wing.l { transform-origin: right center; }
      #loader .wing.r { transform-origin: left center; }
      #loader .twinkle { animation: ld-blink 2.4s ease-in-out infinite alternate; }
      #loader .glow { transition: opacity 0.6s ease; opacity: 0; }
      #loader.ready .glow { opacity: 1; }
      #loader.ready .ring-fill { stroke-width: 5; transition: stroke-width 0.6s ease; }
      #loader .flies span {
        position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #ffe7a0;
        box-shadow: 0 0 10px 3px rgba(255, 220, 120, 0.55); opacity: 0;
        animation: ld-rise 7s linear infinite;
      }
      #loader .kicker { margin: 0; font: 600 13px 'Cinzel', Georgia, serif; letter-spacing: 0.42em; text-transform: uppercase; color: #f2c66b; opacity: 0.9; }
      #loader .pct { margin: -6px 0 0; font: 800 34px 'Cinzel', Georgia, serif; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
      #loader .status { margin: -8px 0 0; min-height: 1.4em; font-weight: 600; font-size: 15px; color: #c4cbe6; transition: opacity 0.3s ease; }
      #loader .status.swap { opacity: 0; }
      @keyframes ld-twinkle { from { opacity: 0.45; } to { opacity: 1; } }
      @keyframes ld-sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
      @keyframes ld-orbit { to { transform: rotate(360deg); } }
      @keyframes ld-flap { from { transform: scaleX(1); } to { transform: scaleX(0.25); } }
      @keyframes ld-blink { from { opacity: 0.2; } to { opacity: 1; } }
      @keyframes ld-rise {
        0% { transform: translate(0, 0); opacity: 0; }
        15% { opacity: 0.9; }
        50% { transform: translate(18px, -45vh); }
        85% { opacity: 0.7; }
        100% { transform: translate(-12px, -90vh); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #loader *, #loader *::after { animation: none !important; }
        #loader .pop { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="loader" role="progressbar" aria-label="Loading the world" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="stars"></div>
      <div class="flies" aria-hidden="true">
        <span style="left: 18%; bottom: -10px; animation-delay: 0s"></span>
        <span style="left: 34%; bottom: -10px; animation-delay: -2.4s"></span>
        <span style="left: 52%; bottom: -10px; animation-delay: -4.9s"></span>
        <span style="left: 67%; bottom: -10px; animation-delay: -1.3s"></span>
        <span style="left: 82%; bottom: -10px; animation-delay: -3.6s"></span>
        <span style="left: 9%; bottom: -10px; animation-delay: -5.8s"></span>
      </div>
      <div class="stage">
        <svg class="emblem" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <radialGradient id="ld-sky" cx="50%" cy="35%" r="70%">
              <stop offset="0" stop-color="#3b5aa8" />
              <stop offset="0.6" stop-color="#22357a" />
              <stop offset="1" stop-color="#16226a" />
            </radialGradient>
            <linearGradient id="ld-hill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#8fd05a" />
              <stop offset="1" stop-color="#3f7a2c" />
            </linearGradient>
            <radialGradient id="ld-glow">
              <stop offset="0" stop-color="#ffe7a0" stop-opacity="0.9" />
              <stop offset="1" stop-color="#ffe7a0" stop-opacity="0" />
            </radialGradient>
            <clipPath id="ld-disc"><circle cx="100" cy="100" r="74" /></clipPath>
          </defs>
          <circle class="glow" cx="100" cy="100" r="98" fill="url(#ld-glow)" />
          <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(242,198,107,0.18)" stroke-width="3" />
          <circle class="ring-fill" cx="100" cy="100" r="86" fill="none" stroke="#f2c66b" stroke-width="3.5" stroke-linecap="round"
            stroke-dasharray="540.35" stroke-dashoffset="540.35" transform="rotate(-90 100 100)" />
          <g clip-path="url(#ld-disc)">
            <circle cx="100" cy="100" r="74" fill="url(#ld-sky)" />
            <circle class="twinkle" cx="62" cy="58" r="1.2" fill="#fff" />
            <circle class="twinkle" cx="134" cy="48" r="1" fill="#fff" style="animation-delay: -0.8s" />
            <circle class="twinkle" cx="148" cy="82" r="1.3" fill="#fff" style="animation-delay: -1.6s" />
            <circle class="twinkle" cx="76" cy="36" r="0.9" fill="#fff" style="animation-delay: -2.1s" />
            <circle cx="138" cy="66" r="9" fill="#fff6dc" opacity="0.9" />
            <circle cx="142" cy="63" r="8" fill="url(#ld-sky)" />
            <ellipse cx="100" cy="176" rx="96" ry="30" fill="url(#ld-hill)" />
            <path class="sway" d="M52 160 q2 -14 -3 -22 M56 160 q0 -12 5 -18 M60 160 q-1 -9 -4 -13" stroke="#5aa636" stroke-width="2.4" fill="none" stroke-linecap="round" />
            <path class="sway" d="M140 158 q2 -13 -2 -21 M144 158 q1 -11 6 -16 M148 158 q-2 -8 -5 -12" stroke="#5aa636" stroke-width="2.4" fill="none" stroke-linecap="round" style="animation-delay: -1.2s" />
            <path class="sway" d="M118 165 q1 -8 -2 -13 M121 165 q1 -7 4 -10" stroke="#7cbb48" stroke-width="2" fill="none" stroke-linecap="round" style="animation-delay: -0.5s" />
            <g class="sapling">
              <path class="stem" d="M100 152 C98 136 104 120 100 92" stroke="#7a5232" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="62" stroke-dashoffset="62" />
              <g class="leaf" transform="translate(99 140) scale(-1 1) rotate(-18)"><path class="pop" data-at="0.3" d="M0 0 C6 -7 16 -8 22 -2 C16 4 6 5 0 0Z" fill="#4c8c30" /></g>
              <g class="leaf" transform="translate(101 131) rotate(-22)"><path class="pop" data-at="0.4" d="M0 0 C6 -7 16 -8 22 -2 C16 4 6 5 0 0Z" fill="#5aa636" /></g>
              <g class="leaf" transform="translate(101 121) scale(-1 1) rotate(-26)"><path class="pop" data-at="0.5" d="M0 0 C6 -7 16 -8 22 -2 C16 4 6 5 0 0Z" fill="#6cb040" /></g>
              <g class="leaf" transform="translate(102 112) rotate(-30)"><path class="pop" data-at="0.6" d="M0 0 C5 -6 13 -7 18 -2 C13 3 5 4 0 0Z" fill="#7cbb48" /></g>
              <g class="leaf" transform="translate(101 103) scale(-1 1) rotate(-34)"><path class="pop" data-at="0.7" d="M0 0 C5 -6 13 -7 18 -2 C13 3 5 4 0 0Z" fill="#94cc5c" /></g>
              <g class="bloom">
                <circle class="pop" data-at="0.8" cx="95" cy="90" r="6" fill="#ef7f88" />
                <circle class="pop" data-at="0.85" cx="105" cy="89" r="6.5" fill="#f6a2b6" />
                <circle class="pop" data-at="0.9" cx="100" cy="83" r="6" fill="#ee8ab4" />
                <circle class="pop" data-at="0.95" cx="100" cy="89" r="3" fill="#f7d63c" />
              </g>
            </g>
          </g>
          <g class="orbit">
            <g transform="translate(100 6)">
              <ellipse class="wing l" cx="-4" cy="0" rx="4.5" ry="3.4" fill="#f6c890" />
              <ellipse class="wing r" cx="4" cy="0" rx="4.5" ry="3.4" fill="#f6c890" />
              <rect x="-0.8" y="-3" width="1.6" height="6" rx="0.8" fill="#2a2018" />
            </g>
          </g>
          <g class="orbit b">
            <g transform="translate(100 196) rotate(180)">
              <ellipse class="wing l" cx="-3.5" cy="0" rx="3.8" ry="2.9" fill="#b58ae0" style="animation-delay: -0.1s" />
              <ellipse class="wing r" cx="3.5" cy="0" rx="3.8" ry="2.9" fill="#b58ae0" style="animation-delay: -0.1s" />
              <rect x="-0.7" y="-2.6" width="1.4" height="5.2" rx="0.7" fill="#2a2018" />
            </g>
          </g>
        </svg>
        <p class="kicker">Growing the world</p>
        <p class="pct">0%</p>
        <p class="status">Waking up…</p>
      </div>
    </div>
    <canvas id="game" aria-hidden="true"></canvas>
    <div id="labels" aria-hidden="true"></div>

    <div id="hud" class="hud" hidden>
      <div class="hud-name"></div>
      <div class="hp"><div class="hp-fill"></div><span class="hp-text"></span></div>
    </div>
    <div id="dmg" aria-hidden="true"></div>
    <div id="weather" class="weather" hidden>
      <button class="wx-pill" type="button" aria-expanded="false" aria-label="Weather">
        <span class="wx-icons"></span><span class="wx-place"></span><span class="wx-temp"></span><span class="wx-time-now"></span>
      </button>
      <div class="wx-panel window" hidden>
        <button class="wx-close" type="button" aria-label="Close">✕</button>
        <h3>Weather</h3>
        <div class="wx-tabs" role="tablist">
          <button type="button" data-mode="live">Live</button>
          <button type="button" data-mode="custom">Custom</button>
        </div>
        <div class="wx-live">
          <form class="wx-search">
            <input type="search" placeholder="Search a place…" aria-label="Place" autocomplete="off" />
            <button type="submit">Go</button>
          </form>
          <ul class="wx-results"></ul>
          <p class="wx-now"></p>
        </div>
        <div class="wx-custom">
          <div class="wx-chips"></div>
          <p class="wx-note">Mix freely, e.g. Sunny + Windy + Snowy.</p>
          <p class="wx-label">Time of day</p>
          <div class="wx-time">
            <button type="button" data-time="auto">Auto</button>
            <button type="button" data-time="day">Day</button>
            <button type="button" data-time="dusk">Sunset</button>
            <button type="button" data-time="night">Night</button>
          </div>
        </div>
        <p class="wx-credit">Live data: <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo.com</a></p>
      </div>
    </div>
    <div id="minimap" class="minimap" role="button" tabindex="0" aria-label="Map (press M)" hidden>
      <canvas></canvas>
      <span class="mm-compass" aria-hidden="true"><b>N</b></span>
      <span class="mm-gem e" aria-hidden="true"></span>
      <span class="mm-gem s" aria-hidden="true"></span>
      <span class="mm-gem w" aria-hidden="true"></span>
      <span class="mm-caption">Map · M</span>
    </div>

    <div id="hint" class="hint"><kbd>WASD</kbd> move · <kbd>Shift</kbd> run · <kbd>E</kbd> interact · <kbd>Space</kbd> attack</div>

    <div id="fish-hint" class="fish-hint" hidden></div>
    <div id="fish-meter" class="fish-meter" aria-hidden="true" hidden><div class="zone"></div><div class="needle"></div></div>
    <div id="fish-alert" class="fish-alert" aria-hidden="true" hidden>!</div>

    <div id="stick" aria-hidden="true"><div class="knob"></div></div>
    <button id="attack" type="button" aria-label="Attack">⚔</button>
    <button id="action" type="button" aria-label="Interact">E</button>

    <div id="dialog" class="window" role="dialog" aria-live="polite" hidden>
      <div class="name"></div>
      <p class="text"></p>
      <span class="more" aria-hidden="true">▼</span>
    </div>

    <div id="panel-wrap" hidden>
      <section id="panel" class="window" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <button class="close" type="button" aria-label="Close">✕</button>
        <div class="content"></div>
      </section>
    </div>

    <div id="title" class="title-screen">
      <div class="title-card">
        <p class="title-kicker">Portfolio</p>
        <h1 class="title-name"></h1>
        <p class="title-role"></p>
        <p class="title-start">Loading the world…</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
