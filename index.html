<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Portfolio</title>
    <meta name="description" content="An explorable 3D adventure portfolio." />
    <meta name="theme-color" content="#16226a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="game" aria-hidden="true"></canvas>
    <div id="labels" aria-hidden="true"></div>

    <div id="hud" class="hud" hidden>
      <div class="hud-name"></div>
      <div class="hp"><div class="hp-fill"></div><span class="hp-text"></span></div>
    </div>
    <div id="dmg" aria-hidden="true"></div>
    <div id="weather" class="weather" hidden>
      <button class="wx-pill" type="button" aria-expanded="false" aria-label="Weather">
        <span class="wx-icons"></span><span class="wx-place"></span><span class="wx-temp"></span>
      </button>
      <div class="wx-panel window" hidden>
        <button class="wx-close" type="button" aria-label="Close">✕</button>
        <h3>Weather</h3>
        <div class="wx-tabs" role="tablist">
          <button type="button" data-mode="live">Live</button>
          <button type="button" data-mode="custom">Custom</button>
        </div>
        <div class="wx-live">
          <form class="wx-search">
            <input type="search" placeholder="Search a place…" aria-label="Place" autocomplete="off" />
            <button type="submit">Go</button>
          </form>
          <ul class="wx-results"></ul>
          <p class="wx-now"></p>
        </div>
        <div class="wx-custom">
          <div class="wx-chips"></div>
          <p class="wx-note">Mix freely, e.g. Sunny + Windy + Snowy.</p>
        </div>
        <p class="wx-credit">Live data: <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo.com</a></p>
      </div>
    </div>
    <div id="minimap" class="minimap" role="button" tabindex="0" aria-label="Map (press M)" hidden>
      <canvas></canvas>
      <span class="mm-compass" aria-hidden="true"><b>N</b></span>
      <span class="mm-gem e" aria-hidden="true"></span>
      <span class="mm-gem s" aria-hidden="true"></span>
      <span class="mm-gem w" aria-hidden="true"></span>
      <span class="mm-caption">Map · M</span>
    </div>

    <div id="hint" class="hint"><kbd>WASD</kbd> move · <kbd>Shift</kbd> run · <kbd>E</kbd> interact · <kbd>Space</kbd> attack</div>

    <div id="fish-hint" class="fish-hint" hidden></div>
    <div id="fish-meter" class="fish-meter" aria-hidden="true" hidden><div class="zone"></div><div class="needle"></div></div>
    <div id="fish-alert" class="fish-alert" aria-hidden="true" hidden>!</div>

    <div id="stick" aria-hidden="true"><div class="knob"></div></div>
    <button id="attack" type="button" aria-label="Attack">⚔</button>
    <button id="action" type="button" aria-label="Interact">E</button>

    <div id="dialog" class="window" role="dialog" aria-live="polite" hidden>
      <div class="name"></div>
      <p class="text"></p>
      <span class="more" aria-hidden="true">▼</span>
    </div>

    <div id="panel-wrap" hidden>
      <section id="panel" class="window" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <button class="close" type="button" aria-label="Close">✕</button>
        <div class="content"></div>
      </section>
    </div>

    <div id="title" class="title-screen">
      <div class="title-card">
        <p class="title-kicker">Portfolio</p>
        <h1 class="title-name"></h1>
        <p class="title-role"></p>
        <p class="title-start">Loading the world…</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
